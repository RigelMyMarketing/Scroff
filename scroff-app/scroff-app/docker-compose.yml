services:
  scroff:
    build: .
    ports:
      - '4000:4000'
    environment:
      # Override these in a real deployment — put real secrets in a local
      # .env file (docker compose reads it automatically) rather than
      # committing them here.
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
    volumes:
      # Persists the SQLite database and uploaded prize photos across
      # container rebuilds/redeploys.
      - scroff-db:/repo/server/prisma
      - scroff-uploads:/repo/server/uploads
    restart: unless-stopped

volumes:
  scroff-db:
  scroff-uploads:
